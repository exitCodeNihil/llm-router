name: Bug report
description: Something does not work or behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste API keys, join tokens or other secrets.
        Report security vulnerabilities privately, as described in SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest request, setting or sequence of clicks that shows the problem.
      placeholder: |
        1. Add a provider of type ...
        2. Send `curl ... /v1/chat/completions` with ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or release in use.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Where it happens
      multiple: true
      options:
        - Control plane (/v1 API)
        - Gateway (Rust)
        - Console
        - Helm chart or deployment
        - Telemetry export
        - Workspaces
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How it is deployed
      options:
        - Docker Compose or quickstart
        - Kubernetes (Helm chart)
        - Plain docker run
        - Built from source
        - Other
  - type: input
    id: provider
    attributes:
      label: Provider and client
      description: The model provider and the tool or SDK calling llm-router, if they matter.
      placeholder: Azure AI Foundry, Claude Code 2.x
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the control plane or the gateway, with secrets removed.
      render: text
