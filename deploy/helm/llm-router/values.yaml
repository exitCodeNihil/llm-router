image:
  repository: ghcr.io/exitcodenihil/llm-router
  tag: ""            # defaults to appVersion
  pullPolicy: IfNotPresent

replicas: 1

databaseUrl: ""      # postgres://user:pass@host:5432/db — or use existingSecret
adminToken: ""
encryptionKey: ""
# name of an existing Secret with keys: database-url, admin-token, encryption-key
existingSecret: ""

# Workspaces (docs/workspaces.md). Adds RBAC for pods, exec, PVCs and secrets
# in this release's namespace, plus the IDE listener on 8081 served from its own origin.
workspaces:
  enabled: false
  ideOrigin: ""      # public URL of the IDE, e.g. https://ide.example.com (required when enabled)
  ideHost: ""        # with ingress.enabled: adds this host, routed to the IDE listener
  cookieDomain: ""   # only when the console and IDE hosts need a shared session cookie

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: ""
  tls: []
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
