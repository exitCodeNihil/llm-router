image:
  repository: ghcr.io/exitcodenihil/llm-router
  tag: ""            # defaults to appVersion
  pullPolicy: IfNotPresent

# The control plane keeps rate limits, budget counters, live metrics and
# telemetry export queues in memory, so it runs as one replica. Scale request
# traffic with gateways (gateway.replicas), which share those limits through
# it. More than one replica is refused unless allowMultipleReplicas is set,
# and then each replica enforces limits on its own traffic only.
replicas: 1
allowMultipleReplicas: false

# Proxies in front of the console (addresses or CIDR ranges, e.g. your ingress
# controller's pod range) whose X-Forwarded-For header names the client. Sign-in
# attempts are rate limited per client, so without this everyone behind the
# ingress shares one limit. Each proxy must append to X-Forwarded-For.
trustedProxies: []

databaseUrl: ""      # postgres://user:pass@host:5432/db — or use existingSecret
adminToken: ""
encryptionKey: ""
# name of an existing Secret with keys: database-url, admin-token, encryption-key
existingSecret: ""

# debug, info, warn or error; and text or json (one object per line).
logLevel: info
logFormat: text

# How many 5-second checks the first start may take before Kubernetes restarts
# the pod. Migrations run before llm-router listens; raise this for the first
# start of a release on a very large database (120 = 10 minutes).
startupFailureThreshold: 120

# How long usage is kept, in whole months before the current one. 0 keeps it
# for ever. usageMonths is for individual requests (the Requests page), at
# least 2; rollupMonths is for the daily totals behind the dashboards and
# per-day spend, at least 3. Hourly totals are always kept three months.
# auditMonths is for the audit log of administrative actions.
retention:
  usageMonths: 0
  rollupMonths: 0
  auditMonths: 0

# Postgres connections. llm-router keeps two pools: one for usage writes,
# gateway sync and config, one for console reads. Their sum must fit under the
# database's max_connections. consoleTimeout cancels a console query that runs
# longer (the console then answers 504).
database:
  maxConns: 16
  consoleMaxConns: 8
  consoleTimeout: 30s

# Workspaces (docs/workspaces.md). Adds RBAC for pods, exec, PVCs and secrets
# in this release's namespace, plus the IDE listener on 8081 served from its own origin.
workspaces:
  enabled: false
  ideOrigin: ""      # public URL of the IDE, e.g. https://ide.example.com (required when enabled)
  ideHost: ""        # with ingress.enabled: adds this host, routed to the IDE listener
  cookieDomain: ""   # only when the console and IDE hosts need a shared session cookie

# The identity llm-router runs as. Its own account by default, so federation rules
# can name it. With create: false, name an existing one (default: the namespace's).
serviceAccount:
  create: true
  name: ""           # default: <release>-llm-router
  annotations: {}

# Anthropic workload identity federation with no key (beta): mounts the pod's service
# account token and points llm-router and gateways at it. Add the federation IDs to the
# provider and a rule in the Claude Console (docs/providers.md#on-gke-eks-and-aks-beta).
anthropicIdentity:
  enabled: false
  audience: https://api.anthropic.com
  expirationSeconds: 600   # 600 to 3600, for the token file
  # file: the kubelet's token file. kubernetes: ask the API server for a new token
  # for each exchange, so a restarted container recovers at once and several rules
  # can share a pod; the file stays as the fallback. Grants the pods create on
  # their own serviceaccounts/token.
  source: file

# Rust gateways (docs/deploy.md#gateways). Create a group on the console's Gateways page
# and pass its join token here or in existingSecret (key: join-token).
gateway:
  enabled: false
  image:
    repository: ghcr.io/exitcodenihil/llm-router-gateway
    tag: ""          # defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 2
  joinToken: ""
  existingSecret: ""
  controlPlaneUrl: ""  # default: this release's llm-router service
  logLevel: info     # debug, info, warn or error
  logFormat: text    # text or json
  # Seconds a gateway keeps serving after the control plane last confirmed its
  # config (LLMR_MAX_CONFIG_AGE, at least 120). Empty: for as long as the
  # control plane is away.
  maxConfigAge: ""
  # Keep the last config and spend, encrypted with a key derived from the join
  # token, and usage the control plane has not acknowledged yet, in an emptyDir
  # (LLMR_STATE_DIR), so a restarted container serves before it reaches the
  # control plane and hands over the usage it held. A new pod starts without it.
  # sizeLimit is twice the usage spool's cap (LLMR_SPOOL_MAX_BYTES, 256 MiB by
  # default): a pod that goes over its emptyDir limit is evicted, so the config
  # and files being written need room beside a full spool. Raise the cap
  # through extraEnv, and this with it.
  state:
    enabled: false
    sizeLimit: 512Mi
  serviceAccount:
    create: true
    name: ""         # default: <release>-llm-router-gateway
    annotations: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
  # On scale-in or rollout: keep accepting for preStopSleepSeconds while the pod
  # leaves the Service (0 turns this off; left out before Kubernetes 1.30), then finish
  # requests in flight (LLMR_SHUTDOWN_TIMEOUT, 30 s) and upload the last usage.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 50
  # Scale gateways on CPU (needs metrics-server and a CPU request), and
  # optionally on memory. Gateways scale horizontally; the control plane does
  # not (see replicas above). A gateway mostly waits on upstreams, and past
  # saturation its memory grows with its open connections while CPU can stay
  # low: set a memory limit, and a memory target to scale on it too.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null   # e.g. 70, against the memory request

# Prometheus metrics (docs/monitoring.md). Gateways serve /metrics on their
# traffic port; the control plane serves it on its own port, which the
# ingress does not route, so the console's host never exposes it.
metrics:
  port: 9090         # the control plane's metrics port; 0 serves /metrics on 8080
  # prometheus.io/scrape, /port and /path annotations on both pods; left out
  # while podMonitor is on, so no target is scraped twice.
  podAnnotations: true
  # PodMonitors for the Prometheus Operator: the control plane and every gateway.
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}       # e.g. release: kube-prometheus-stack, to match your Prometheus
  # Alerting rules for the Prometheus Operator.
  prometheusRule:
    enabled: false
    labels: {}
    # Series these alerts look at; default: namespace="<this release's namespace>".
    selector: ""
    gatewayMemoryRatio: 0.85   # of the gateway's memory limit
    errorRatio: 0.05           # 5xx share of /v1 requests
    notSyncingSeconds: 30

# Extra env and volumes for the llm-router container.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: ""
  tls: []
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
