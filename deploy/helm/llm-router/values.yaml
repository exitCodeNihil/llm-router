image:
  repository: ghcr.io/exitcodenihil/llm-router
  tag: ""            # defaults to appVersion
  pullPolicy: IfNotPresent

# "all" runs the control plane + gateway (needs database).
# "gateway" runs an edge node (needs controlPlaneUrl + nodeToken).
mode: all

replicas: 1

# mode=all
databaseUrl: ""      # postgres://user:pass@host:5432/db — or use existingSecret
adminToken: ""
encryptionKey: ""
# name of an existing Secret with keys: database-url, admin-token, encryption-key
existingSecret: ""

# mode=gateway
controlPlaneUrl: ""
nodeToken: ""        # or key node-token in existingSecret

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: ""
  tls: []
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
