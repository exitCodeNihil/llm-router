{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llm-router
type: Opaque
stringData:
  {{- if eq .Values.mode "all" }}
  database-url: {{ required "databaseUrl (or existingSecret) is required in mode=all" .Values.databaseUrl | quote }}
  admin-token: {{ .Values.adminToken | quote }}
  encryption-key: {{ required "encryptionKey is required in mode=all" .Values.encryptionKey | quote }}
  {{- else }}
  node-token: {{ required "nodeToken (or existingSecret) is required in mode=gateway" .Values.nodeToken | quote }}
  {{- end }}
{{- end }}
