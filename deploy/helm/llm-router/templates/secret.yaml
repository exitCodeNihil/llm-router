{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llm-router
type: Opaque
stringData:
  database-url: {{ required "databaseUrl (or existingSecret) is required" .Values.databaseUrl | quote }}
  admin-token: {{ .Values.adminToken | quote }}
  encryption-key: {{ required "encryptionKey is required" .Values.encryptionKey | quote }}
{{- end }}
