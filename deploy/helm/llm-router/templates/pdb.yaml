{{- if .Values.podDisruptionBudget.enabled }}
{{- if gt (int .Values.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-llm-router
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-router
      app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- end }}
{{- if and .Values.gateway.enabled (or .Values.gateway.autoscaling.enabled (gt (int .Values.gateway.replicas) 1)) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-llm-router-gateway
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-router-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
