{{- if and (gt (int .Values.replicas) 1) (not .Values.allowMultipleReplicas) }}
{{- fail "replicas > 1 splits rate limits, budgets, live metrics and telemetry queues across processes, so each replica enforces only part of them. Scale traffic with gateway groups (gateway.replicas) instead, or set allowMultipleReplicas=true to accept that." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-llm-router
  labels: &labels
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
      {{- if and .Values.metrics.podAnnotations (not .Values.metrics.podMonitor.enabled) }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | default 8080 | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      {{- $ws := .Values.workspaces.enabled }}
      serviceAccountName: {{ include "llm-router.serviceAccountName" . }}
      containers:
        - name: llm-router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.port }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
            {{- if $ws }}
            - name: ide
              containerPort: 8081
            {{- end }}
          env:
            {{- $secret := .Values.existingSecret | default (printf "%s-llm-router" .Release.Name) }}
            - name: LLMR_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: database-url}}
            - name: LLMR_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: admin-token, optional: true}}
            - name: LLMR_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: encryption-key}}
            {{- if $ws }}
            - name: LLMR_IDE_LISTEN
              value: ":8081"
            - name: LLMR_IDE_ORIGIN
              value: {{ required "workspaces.ideOrigin is required when workspaces are enabled" .Values.workspaces.ideOrigin | quote }}
            {{- with .Values.workspaces.cookieDomain }}
            - name: LLMR_COOKIE_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.port }}
            - name: LLMR_METRICS_LISTEN
              value: ":{{ .Values.metrics.port }}"
            {{- end }}
            {{- with .Values.trustedProxies }}
            - name: LLMR_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.anthropicIdentity.enabled }}
            {{- include "llm-router.anthropicIdentityEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.anthropicIdentity.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.anthropicIdentity.enabled }}
            {{- include "llm-router.anthropicIdentityMount" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.anthropicIdentity.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.anthropicIdentity.enabled }}
        {{- include "llm-router.anthropicIdentityVolume" . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
