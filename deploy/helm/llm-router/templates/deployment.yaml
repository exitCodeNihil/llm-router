apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-llm-router
  labels: &labels
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      {{- $ws := .Values.workspaces.enabled }}
      {{- if $ws }}
      serviceAccountName: {{ .Release.Name }}-llm-router
      {{- end }}
      containers:
        - name: llm-router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
            {{- if $ws }}
            - name: ide
              containerPort: 8081
            {{- end }}
          env:
            {{- $secret := .Values.existingSecret | default (printf "%s-llm-router" .Release.Name) }}
            - name: LLMR_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: database-url}}
            - name: LLMR_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: admin-token, optional: true}}
            - name: LLMR_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: encryption-key}}
            {{- if $ws }}
            - name: LLMR_IDE_LISTEN
              value: ":8081"
            - name: LLMR_IDE_ORIGIN
              value: {{ required "workspaces.ideOrigin is required when workspaces are enabled" .Values.workspaces.ideOrigin | quote }}
            {{- with .Values.workspaces.cookieDomain }}
            - name: LLMR_COOKIE_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
