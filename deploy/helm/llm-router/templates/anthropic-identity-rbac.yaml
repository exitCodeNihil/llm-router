{{- if and .Values.anthropicIdentity.enabled (eq (include "llm-router.anthropicIdentitySource" .) "kubernetes") }}
{{- $accounts := list (include "llm-router.serviceAccountName" .) }}
{{- if .Values.gateway.enabled }}
{{- $accounts = append $accounts (include "llm-router.gatewayServiceAccountName" .) | uniq }}
{{- end }}
{{- range $accounts }}
# Lets pods running as {{ . }} request tokens for that account, for Anthropic
# workload identity: for no other account, and nothing else in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ . }}-identity
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]
    resourceNames: [{{ . | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ . }}-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ . }}-identity
subjects:
  - kind: ServiceAccount
    name: {{ . }}
---
{{- end }}
{{- end }}
