apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-llm-router
  labels:
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
    {{- if and .Values.workspaces.enabled (eq .Values.mode "all") }}
    - name: ide
      port: 8081
      targetPort: ide
    {{- end }}
  selector:
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/instance: {{ .Release.Name }}
