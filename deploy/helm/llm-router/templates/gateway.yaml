{{- if .Values.gateway.enabled }}
{{- $fullname := printf "%s-llm-router-gateway" .Release.Name }}
{{- if not .Values.gateway.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
type: Opaque
stringData:
  join-token: {{ required "gateway.joinToken (or gateway.existingSecret) is required: create a group on the console's Gateways page" .Values.gateway.joinToken | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels: &labels
    app.kubernetes.io/name: llm-router-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicas }}
  {{- end }}
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
      {{- if and .Values.metrics.podAnnotations (not .Values.metrics.podMonitor.enabled) }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      serviceAccountName: {{ include "llm-router.gatewayServiceAccountName" . }}
      # Long enough to wait out endpoint removal, finish requests in flight
      # (LLMR_SHUTDOWN_TIMEOUT) and upload the last usage.
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LLMR_CONTROL_PLANE_URL
              value: {{ .Values.gateway.controlPlaneUrl | default (printf "http://%s-llm-router:%v" .Release.Name .Values.service.port) | quote }}
            - name: LLMR_JOIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.gateway.existingSecret | default $fullname }}, key: join-token}}
            - name: LLMR_LOG_LEVEL
              value: {{ .Values.gateway.logLevel | quote }}
            - name: LLMR_LOG_FORMAT
              value: {{ .Values.gateway.logFormat | quote }}
            {{- with .Values.gateway.maxConfigAge }}
            - name: LLMR_MAX_CONFIG_AGE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.gateway.state.enabled }}
            - name: LLMR_STATE_DIR
              value: /var/lib/llmr
            {{- end }}
            {{- if .Values.anthropicIdentity.enabled }}
            {{- include "llm-router.anthropicIdentityEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.gateway.state.enabled .Values.anthropicIdentity.enabled .Values.gateway.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.gateway.state.enabled }}
            - name: state
              mountPath: /var/lib/llmr
            {{- end }}
            {{- if .Values.anthropicIdentity.enabled }}
            {{- include "llm-router.anthropicIdentityMount" . | nindent 12 }}
            {{- end }}
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            timeoutSeconds: 3
          {{- if and .Values.gateway.preStopSleepSeconds (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version) }}
          # Keep accepting while the endpoint is removed from Services, so a
          # scale-in or rollout refuses no connections.
          lifecycle:
            preStop:
              sleep: {seconds: {{ .Values.gateway.preStopSleepSeconds }}}
          {{- end }}
          resources: {{- toYaml (.Values.gateway.resources | default dict) | nindent 12 }}
      {{- if or .Values.gateway.state.enabled .Values.anthropicIdentity.enabled .Values.gateway.extraVolumes }}
      volumes:
        {{- if .Values.gateway.state.enabled }}
        # Outlives a container restart, not the pod.
        - name: state
          emptyDir:
            sizeLimit: {{ .Values.gateway.state.sizeLimit }}
        {{- end }}
        {{- if .Values.anthropicIdentity.enabled }}
        {{- include "llm-router.anthropicIdentityVolume" . | nindent 8 }}
        {{- end }}
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: llm-router-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: 8080
{{- end }}
